# Backend saja (frontend ada di Vercel; HTTPS oleh Caddy di /opt/proxy). Dipakai di VPS (di-copy oleh deploy.yml ke /opt/collaboard). Rahasia ada di /opt/collaboard/.env, bukan di repo.
# Dijalankan: IMAGE_REPO=ghcr.io/<owner>/<repo> IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml up -d
services:
  server:
    image: ${IMAGE_REPO}/server:${IMAGE_TAG:-latest}
    container_name: collab-server # nama ini dipakai proxy/Caddyfile; harus unik antar aplikasi
    restart: unless-stopped
    networks: [default, web] # default: ke postgres/redis; web: dijangkau Caddy
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  web:
    external: true

volumes:
  postgres_data:
