services:
  server:
    build:
      context: ./backend-collaboard
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ./frontend-collaboard
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"