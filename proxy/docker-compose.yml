# Reverse proxy bersama. Dipasang manual sekali di /opt/proxy (tidak ikut pipeline deploy aplikasi).
# Prasyarat: docker network create web
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [web]

networks:
  web:
    external: true

volumes:
  caddy_data:
