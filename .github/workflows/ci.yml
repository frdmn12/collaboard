name: CI

on:
  pull_request:
  workflow_call: # dipanggil oleh deploy.yml, supaya deploy hanya jalan kalau CI hijau

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-collaboard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: collabboard
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d collabboard" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: collabboard
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      MAIL_HOST: localhost
      MAIL_PORT: 1025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-collaboard/package-lock.json
      - run: npm ci
      - run: npx eslint "{src,apps,libs,test}/**/*.ts" # tanpa --fix, CI tidak boleh mengubah kode
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-collaboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-collaboard/package-lock.json
      - run: npm ci
      - run: npm run lint
        continue-on-error: true # ponytail: 19 error react-hooks lama; hapus baris ini setelah diperbaiki
      - run: npm run build
